name: Build package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Keep going so one failing Node version still reports the others.
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack (activates the pinned Yarn)
        run: corepack enable

      - name: Install dependencies (lockfile must be up to date)
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Build dist/
        run: yarn build

      - name: Verify generated data is committed and loadable
        run: |
          node -e "import('./dist/index.js').then(async m => {
            if (m.countries.length === 0) throw new Error('no countries in build');
            const states = await m.loadStates(m.countries[0].code);
            console.log(\`${'$'}{m.countries.length} countries, \${states.length} states in \${m.countries[0].code}\`);
          })"
